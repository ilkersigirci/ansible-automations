---
- name: Verify the controller can read the Ansible.Test vault entry
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - check_rbw

  tasks:
    - name: Verify the test username and password are readable
      ansible.builtin.command:
        argv: [rbw, get, Ansible.Test, --field, "{{ item }}"]
      loop: [username, password]
      check_mode: false
      changed_when: false
      register: rbw_test_field
      failed_when: rbw_test_field.rc != 0 or rbw_test_field.stdout | length == 0
      no_log: true
